<!-- @dsCard group="Components" viewport="700x300" subtitle="default, focus, error, disabled" name="Select" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../styles.css">
<style>
  body {
    margin: 0;
    padding: var(--leaf-space-4);
    background: var(--leaf-surface-card);
  }
  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--leaf-space-5) var(--leaf-space-6);
  }
  .cell {
    display: flex;
    flex-direction: column;
    width: 260px;
  }
  .field-label {
    display: block;
    font: var(--leaf-type-ui-label);
    font-weight: 600;
    color: var(--leaf-color-ink);
    margin-bottom: var(--leaf-space-2);
  }
  .field-label.is-disabled {
    color: var(--leaf-text-muted);
  }
  .control {
    position: relative;
    display: flex;
    align-items: center;
  }
  .field {
    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: none;
    width: 100%;
    font: var(--leaf-type-ui-body);
    color: var(--leaf-color-ink);
    background: var(--leaf-color-canvas);
    border: 1px solid var(--leaf-border-input);
    border-radius: var(--leaf-radius-md);
    padding: var(--leaf-space-3) var(--leaf-space-6) var(--leaf-space-3) var(--leaf-space-4);
  }
  .field.focus {
    border-color: var(--leaf-color-coral);
    outline: 2px solid var(--leaf-focus-ring);
    outline-offset: 1px;
  }
  .field.error {
    border-color: var(--leaf-color-state-error);
  }
  .error-text {
    font: var(--leaf-type-ui-label);
    color: var(--leaf-color-state-error);
    margin-top: var(--leaf-space-2);
  }
  .field.is-disabled {
    color: var(--leaf-text-muted);
    background: var(--leaf-color-stone-faint);
    border: 1px solid var(--leaf-border-light);
    opacity: 0.7;
  }
  .chevron {
    position: absolute;
    right: 14px;
    display: flex;
    pointer-events: none;
    color: var(--leaf-color-warm-grey);
  }
  .cap {
    font: var(--leaf-type-caption);
    color: var(--leaf-text-muted);
    margin-top: var(--leaf-space-2);
  }
</style>
</head>
<body>
  <div class="row">
    <div class="cell">
      <label class="field-label" for="s1">Reporting frequency</label>
      <div class="control">
        <select id="s1" class="field">
          <option>Daily</option>
          <option selected>Weekly</option>
          <option>Monthly</option>
        </select>
        <span class="chevron">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </span>
      </div>
      <span class="cap">Default</span>
    </div>
    <div class="cell">
      <label class="field-label" for="s3">Reporting frequency</label>
      <div class="control">
        <select id="s3" class="field focus">
          <option selected>Weekly</option>
        </select>
        <span class="chevron">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </span>
      </div>
      <span class="cap">Focus</span>
    </div>
    <div class="cell">
      <label class="field-label" for="s4">Reporting frequency</label>
      <div class="control">
        <select id="s4" class="field error">
          <option selected>Choose a frequency</option>
        </select>
        <span class="chevron">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </span>
      </div>
      <span class="error-text">Pick a reporting frequency.</span>
      <span class="cap">Error</span>
    </div>
    <div class="cell">
      <label class="field-label is-disabled" for="s2">Export format</label>
      <div class="control">
        <select id="s2" class="field is-disabled" disabled>
          <option selected>CSV</option>
        </select>
        <span class="chevron">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </span>
      </div>
      <span class="cap">Disabled</span>
    </div>
  </div>
</body>
</html>
